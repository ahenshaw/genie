name: Server

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: genie-test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -pgenie-test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The tree model, and the server against a real MySQL.
      - name: Test
        run: cargo test -p genie-core -p genie-server
        env:
          GENIE_TEST_MYSQL: mysql://root:genie-test@127.0.0.1:3306
