# genie.henshaw.us: everything goes to genie-server on 127.0.0.1:3100.
#
# This is the plain-HTTP site. `certbot --apache -d genie.henshaw.us --redirect`
# turns it into a redirect and writes genie.henshaw.us-le-ssl.conf, a copy
# with the certificate, which then does the serving.

<Directory /var/www/genie>
    Require all granted
</Directory>

<VirtualHost *:80>
    ServerName genie.henshaw.us
    ServerAdmin webmaster@localhost
    # Only for certbot's challenge files under /.well-known.
    DocumentRoot /var/www/genie
    ErrorLog ${APACHE_LOG_DIR}/genie-error.log
    CustomLog ${APACHE_LOG_DIR}/genie-access.log combined

    ProxyPreserveHost On
    # A large .gdz import can take a while.
    ProxyTimeout 600
    ProxyPass         /.well-known  !
    ProxyPass         /             http://127.0.0.1:3100/
    ProxyPassReverse  /             http://127.0.0.1:3100/
</VirtualHost>
