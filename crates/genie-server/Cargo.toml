[package]
name = "genie-server"
version = "0.1.0"
edition = "2024"
description = "The shared family tree at genie.henshaw.us: accounts, the tree and its history in MySQL, documents on disk, over an HTTPS API."

[dependencies]
genie-core = { path = "../genie-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MySQL is reached over loopback only, so no TLS.
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio", "migrate", "macros"] }
argon2 = { version = "0.5", features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
time = { version = "0.3", default-features = false, features = ["std"] }
dotenvy = "0.15"
mime_guess = "2"
rpassword = "7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
