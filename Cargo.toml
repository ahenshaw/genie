[package]
name = "genie"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui-elegance = "0.16"
rfd = "0.17"
nodez = "0.6"
egui_extras = { version = "0.36", features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
open = "5"
pathdiff = "0.2"
strsim = "0.11"
ureq = "3"
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2
