[package]
name = "genie"
version = "0.2.1"
edition = "2024"

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui-elegance = "0.16"
nodez = "0.6"
egui_extras = { version = "0.36", features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
pathdiff = "0.2"
strsim = "0.11"
serde_json = "1"
web-time = "1"
# .gdz bundles (GEDZIP); pure-Rust deflate so the browser build compiles too.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }
# Documents keep their modified times in bundles.
time = { version = "0.3", default-features = false, features = ["std"] }

# The desktop app, and the server that shows it in a browser (`genie --serve`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"
open = "5"
ureq = "3"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs"] }
rust-embed = "8"
mime_guess = "2"

# The browser build, made with `trunk build --release`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui_extras = { version = "0.36", features = ["http"] }
ehttp = "0.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BeforeUnloadEvent", "console", "Document", "HtmlCanvasElement", "Location", "Window"] }

[profile.dev.package."*"]
opt-level = 2
