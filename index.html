<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Genie</title>
    <!-- The browser build of Genie; `trunk build --release` puts it in dist/ for `genie --serve`. -->
    <link data-trunk rel="rust" data-bin="genie" data-wasm-opt="2">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #ece9e4; }
        /* Touches belong to the app: without touch-action none, Safari on an
           iPad runs its own tap and zoom gestures, which can take focus away
           from the hidden input the on-screen keyboard types into. */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <canvas id="genie_canvas"></canvas>
</body>
</html>
